name: CI
env:
  DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec brakeman --no-pager
  
  scan_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 20
  
      - run: npm ci
      - run: npm audit --audit-level=moderate || true

test:
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
  
      - name: Install gems
        run: bundle install --jobs 4 --retry 3
  
      - name: Setup DB
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
  
      - name: Run RSpec tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
          AWS_BUCKET: fake
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_REGION: us-east-1
        run: bundle exec rspec

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_USER/myapp:latest .
          docker push $DOCKER_USER/myapp:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
            RAILS_ENV=production
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            echo "Deploying Docker container on EC2..."
            docker system prune -a -f
            docker pull $DOCKER_USER/myapp:latest
            docker rm -f redis || true 
            docker rm -f myapp_container || true
            docker run -d \
               --name myapp_container \
              -p 3000:3000 \
              -e RAILS_ENV=production \
              -e RAILS_MASTER_KEY=$RAILS_MASTER_KEY \
              -e DATABASE_URL="$DATABASE_URL" \
              -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              -e AWS_REGION=us-east-1 \
              -e AWS_BUCKET=ielts-learning-platform-uploads \
              -e GMAIL_USERNAME=$GMAIL_USERNAME \
              -e GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD \
              -e REDIS_URL=redis://:Nguyenthiphu1243@172.31.18.246:6379/0 \
              -e APP_HOST=d34ute7tylgmox.cloudfront.net \
              $DOCKER_USER/myapp:latest \
              sh -c "DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rails db:drop db:create db:migrate db:seed && bundle exec rails server -b 0.0.0.0 -p 3000"
            docker rm -f sidekiq_worker || true
            docker run -d \
              --name sidekiq_worker \
              -e RAILS_ENV=production \
              -e RAILS_MASTER_KEY=$RAILS_MASTER_KEY \
              -e DATABASE_URL="$DATABASE_URL" \
              -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              -e AWS_REGION=us-east-1 \
              -e AWS_BUCKET=ielts-learning-platform-uploads \
              -e GMAIL_USERNAME=$GMAIL_USERNAME \
              -e GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD \
              -e REDIS_URL=redis://:Nguyenthiphu1243@172.31.18.246:6379/0 \
              -e APP_HOST=d34ute7tylgmox.cloudfront.net \
              $DOCKER_USER/myapp:latest \
              bundle exec sidekiq
