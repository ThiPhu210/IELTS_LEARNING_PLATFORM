name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}   
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

jobs:

  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm audit --audit-level=moderate || true


  test:
    needs: [scan_ruby, scan_js]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Setup DB
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
        run: |
          bundle exec rails db:drop db:create 
          bundle exec rails db:schema:load
          bundle exec rails db:migrate

      - name: Run RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
          AWS_BUCKET: fake
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_REGION: us-east-1
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_PUBLIC_KEY: pk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
        run: bundle exec rspec


  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_USER/myapp:latest .
          docker push $DOCKER_USER/myapp:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
            export RAILS_ENV=production
            export RAILS_MASTER_KEY="${{ secrets.RAILS_MASTER_KEY }}"
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export GMAIL_USERNAME="${{ secrets.GMAIL_USERNAME }}"
            export GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"
            export STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            export STRIPE_PUBLIC_KEY="${{ secrets.STRIPE_PUBLIC_KEY }}"
            export STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"

            echo "Deploying Docker container on EC2..."

            docker system prune -a -f
            docker pull $DOCKER_USER/myapp:latest

            docker rm -f redis || true
            docker rm -f myapp_container || true

            docker run -d \
              --name myapp_container \
              -p 3000:3000 \
              -e RAILS_ENV=$RAILS_ENV \
              -e RAILS_MASTER_KEY=$RAILS_MASTER_KEY \
              -e DATABASE_URL="$DATABASE_URL" \
              -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              -e AWS_REGION=us-east-1 \
              -e AWS_BUCKET=ielts-learning-platform-uploads \
              -e GMAIL_USERNAME=$GMAIL_USERNAME \
              -e GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD \
              -e REDIS_URL=redis://:Nguyenthiphu1243@172.31.18.246:6379/0 \
              -e APP_HOST=https://resigned-unincreased-agnus.ngrok-free.dev \
              -e STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY \
              -e STRIPE_PUBLIC_KEY=$STRIPE_PUBLIC_KEY \
              -e STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET \

              $DOCKER_USER/myapp:latest \
              sh -c "DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rails db:drop db:create db:migrate db:seed && bundle exec rails server -b 0.0.0.0 -p 3000"
              echo "Starting ngrok..."
              pkill ngrok || true
              nohup ngrok http 3000 > ngrok.log 2>&1 &
              sleep 3
              curl http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
              
            docker rm -f sidekiq_worker || true
            docker run -d \
              --name sidekiq_worker \
              -e RAILS_ENV=$RAILS_ENV \
              -e RAILS_MASTER_KEY=$RAILS_MASTER_KEY \
              -e DATABASE_URL="$DATABASE_URL" \
              -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              -e AWS_REGION=us-east-1 \
              -e AWS_BUCKET=ielts-learning-platform-uploads \
              -e GMAIL_USERNAME=$GMAIL_USERNAME \
              -e GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD \
              -e REDIS_URL=redis://:Nguyenthiphu1243@172.31.18.246:6379/0 \
              -e APP_HOST=https://resigned-unincreased-agnus.ngrok-free.dev \
              $DOCKER_USER/myapp:latest \
              bundle exec sidekiq
